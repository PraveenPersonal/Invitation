kind = "web"
previewPath = "/"
title = "Wedding Invitation — M. Karthikeyan & K. Soundariya"
version = "1.0.0"
id = "artifacts/wedding-invite"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24366

[services.development]
run = "pnpm --filter @workspace/wedding-invite run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wedding-invite", "run", "build" ]
serve = "static"
publicDir = "artifacts/wedding-invite/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24366"
BASE_PATH = "/"
